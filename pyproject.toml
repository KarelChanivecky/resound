[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resound"
version = "0.7.0"
description = "Musical instrument tuner demonstrating producer/consumer threading, z-score peak detection, and FFT analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.6",
    "sounddevice>=0.4",
    "matplotlib>=3.5",
]

[project.scripts]
resound = "main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["main", "musical_note", "note_spec", "sound_sample",
              "windowed_sample", "spectrum", "detected_peaks"]
